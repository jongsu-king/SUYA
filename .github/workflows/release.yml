name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pyinstaller
      - run: python -m pytest -q
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash packaging/build.sh
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Install the installer and run the installed copy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          $log = Join-Path $PWD 'install.log'
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/CLOSEAPPLICATIONS','/NORESTARTAPPLICATIONS',"/LOG=$log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content $log; throw "installer exit code $($proc.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\SUYA'
          if (-not (Test-Path "$app\SUYA.exe")) { Get-Content $log; throw "SUYA.exe not found in $app" }
          $report = Join-Path $PWD 'installed-self-test.txt'
          Start-Process -FilePath "$app\SUYA.exe" -ArgumentList 'self-test','--out',$report -Wait
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'gui ok' -Quiet)) { throw 'the installed copy failed its self-test' }
          $unins = (Get-ChildItem "$app\unins*.exe" | Select-Object -First 1).FullName
          $proc = Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "uninstaller exit code $($proc.ExitCode)" }
          if (Test-Path "$app\SUYA.exe") { throw 'SUYA.exe is still there after the uninstall' }

      - name: Mount the disk image, copy the app and run it (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -n 1)
          MOUNT=$(mktemp -d)
          TARGET=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$MOUNT" "$DMG"
          ditto "$MOUNT/SUYA.app" "$TARGET/SUYA.app"
          hdiutil detach "$MOUNT" -quiet
          xattr -dr com.apple.quarantine "$TARGET/SUYA.app" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$TARGET/SUYA.app/Contents/Info.plist"
          "$TARGET/SUYA.app/Contents/MacOS/suya" self-test --out "$TARGET/self-test.txt"
          cat "$TARGET/self-test.txt"
          grep -q "gui ok" "$TARGET/self-test.txt"

      - name: Extract the archive, run install.sh and the installed copy (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          ARCHIVE=$(ls dist/*.tar.gz | head -n 1)
          WORK=$(mktemp -d)
          tar -xzf "$ARCHIVE" -C "$WORK"
          ROOT=$(dirname "$(find "$WORK" -name install.sh | head -n 1)")
          export HOME="$WORK/home"
          mkdir -p "$HOME"
          bash "$ROOT/install.sh"
          test -x "$HOME/.local/bin/suya"
          test -f "$HOME/.local/share/applications/suya.desktop"
          "$HOME/.local/bin/suya" self-test --out "$WORK/self-test.txt"
          cat "$WORK/self-test.txt"
          grep -q "gui ok" "$WORK/self-test.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Every file the in-app updater looks for must be present
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts && ls -l
          for name in "SUYA-$VERSION-windows-x64-setup.exe" "SUYA-$VERSION-macos-arm64.dmg" \
                      "SUYA-$VERSION-macos-x86_64.dmg" "SUYA-$VERSION-linux-x86_64.tar.gz"; do
            test -s "$name" || { echo "missing $name"; exit 1; }
          done
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: false
          draft: false
